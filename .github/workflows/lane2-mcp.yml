name: Lane 2 - MCP Toolbox Connectivity Check

on:
  push:
    branches: [ main, agent ]
    paths:
      - "agent/**"
      - ".github/workflows/lane2-mcp.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "agent/**"

jobs:
  verify-mcp-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Fetch MCP Toolbox for Databases (Google-managed MCP server)
        run: |
          mkdir -p bin
          curl -sL --fail -o bin/toolbox \
            "https://storage.googleapis.com/genai-toolbox/v1.1.0/linux/amd64/toolbox"
          chmod +x bin/toolbox

      - name: Start MCP Toolbox server
        env:
          BIGQUERY_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          ./bin/toolbox --config agent/mcp_tools.yaml --port 5050 > toolbox.log 2>&1 &
          for i in $(seq 1 10); do
            if (exec 3<>/dev/tcp/127.0.0.1/5050) 2>/dev/null; then
              exec 3<&- 3>&-
              echo "MCP Toolbox server is up"
              exit 0
            fi
            sleep 1
          done
          echo "MCP Toolbox server failed to start:"
          cat toolbox.log
          exit 1

      - name: Verify agent loads live MCP tools
        env:
          MCP_TOOLBOX_URL: http://127.0.0.1:5050
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          from agent.agent import tools_list
          names = [getattr(t, '__name__', None) or getattr(t, 'name', t.__class__.__name__) for t in tools_list]
          print('Loaded tools:', names)
          mcp_tool_names = {'execute_sql', 'get_dataset_info', 'get_table_info', 'list_dataset_ids', 'list_table_ids'}
          assert mcp_tool_names & set(names), f'No MCP Toolbox tools found in {names}'
          assert len(tools_list) > 3, 'Expected custom tools + MCP tools, got only ' + str(len(tools_list))
          print('MCP Toolbox connection verified: live BigQuery tools are wired into root_agent.')
          "
