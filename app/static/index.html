<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RescueDispatch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1613'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%2315803d'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
/* Layout: the coordinator's board of offers in flight → one offer at a time (cards left, map right).
   Built on Contract 1 (POST /api/match); everything the backend doesn't hold yet is a mock in `api` below. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --fg: #0f1613;
  --muted: #5d6963;
  --line: #dfe4e0;
  --accent: #0f1613;
  --on-accent: #ffffff;
  --good: #15803d;
  --good-soft: #dcfce7;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --donor: #1d4ed8;
  --donor-soft: #dbeafe;
  --map-bg: #e6eae5;
  --tile-filter: saturate(0.55) contrast(0.95);
  --font-display: "Sora", "Helvetica Neue", Arial, sans-serif;
  --font-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(15, 22, 19, 0.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f0d; --surface: #151b18; --surface-2: #1b2320; --fg: #f1f4f2; --muted: #96a29b; --line: #26312b;
    --accent: #f1f4f2; --on-accent: #0b0f0d;
    --good: #4ade80; --good-soft: #10351f; --warn: #fbbf24; --warn-soft: #3a2a08; --bad: #f87171; --bad-soft: #3f1515;
    --donor: #60a5fa; --donor-soft: #0f2447;
    --map-bg: #111614;
    --tile-filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(0.9) saturate(0.4);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f0d; --surface: #151b18; --surface-2: #1b2320; --fg: #f1f4f2; --muted: #96a29b; --line: #26312b;
  --accent: #f1f4f2; --on-accent: #0b0f0d;
  --good: #4ade80; --good-soft: #10351f; --warn: #fbbf24; --warn-soft: #3a2a08; --bad: #f87171; --bad-soft: #3f1515;
  --donor: #60a5fa; --donor-soft: #0f2447;
  --map-bg: #111614;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(0.8) contrast(0.9) saturate(0.4);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--donor); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; height: 100%; min-height: 0; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 10px; }
.brand .mark { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; }
.brand h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.foot { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; }
.foot .link { color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; font: inherit; cursor: pointer; }

.btn { border-radius: 10px; padding: 11px 12px; font-weight: 600; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; white-space: nowrap; }
.btn.go { background: var(--good); border-color: var(--good); color: #ffffff; }
.btn.no { border-color: var(--bad); color: var(--bad); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.6; cursor: wait; }

/* Screen 1: the board */
.board { min-height: 0; overflow: auto; display: grid; align-content: start; gap: 8px; }
.board h2 { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 2px 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--fg); }
.row:hover { border-color: var(--accent); }
.row .what { font-weight: 600; font-size: 14px; }
.row .who { font-size: 12px; color: var(--muted); margin-top: 2px; }
.row .right { display: grid; justify-items: end; gap: 4px; }
.lc { font-family: var(--font-display); font-size: 17px; font-weight: 600; white-space: nowrap; }
.lc.warn { color: var(--warn); } .lc.bad { color: var(--bad); } .lc.done { color: var(--good); font-size: 13px; }
.stage { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.stage.matched { background: var(--good-soft); color: var(--good); }
.stage.sent { background: var(--donor-soft); color: var(--donor); }
.stage.accepted, .stage.picked_up { background: var(--warn-soft); color: var(--warn); }
.stage.delivered { background: var(--good-soft); color: var(--good); }
.stage.nobody { background: var(--bad-soft); color: var(--bad); }
.ex { font-size: 10.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.empty-board { text-align: center; color: var(--muted); padding: 48px 10px; display: grid; gap: 10px; justify-items: center; }
.empty-board h2 { font-size: 20px; color: var(--fg); text-transform: none; letter-spacing: 0; }

/* Screen 2: a donor called */
.screen-new { min-height: 0; overflow: auto; display: grid; justify-items: center; align-content: start; }
.form { width: min(640px, 100%); display: grid; gap: 12px; }
.form h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.calls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.call { text-align: left; background: var(--surface-2); border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; color: var(--fg); display: grid; gap: 2px; }
.call:hover { border-color: var(--line); }
.call[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
.call .t { font-weight: 600; font-size: 13px; }
.call .d { font-size: 11.5px; color: var(--muted); }
label.f, .f { display: grid; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); }
label.f input, label.f textarea { width: 100%; font: inherit; font-size: 14px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 9px 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.unit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.cold { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
.cold input { width: 18px; height: 18px; accent-color: var(--good); }

/* Screen 3: one offer */
.screen-offer { display: grid; grid-template-columns: 460px minmax(0, 1fr); gap: 14px; min-height: 0; height: 100%; }
.stack { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.card h2 { font-size: 14px; font-weight: 600; }
.card h2 small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
.hint { font-size: 12.5px; color: var(--muted); }
.ohead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; }
.ohead .what { font-weight: 600; font-size: 15px; }
.ohead .who { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ohead .clock { text-align: right; }
.ohead .clock .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1.05; letter-spacing: -0.01em; white-space: nowrap; }
.ohead .clock .by { font-size: 11.5px; color: var(--muted); }
.ohead .clock.warn .v { color: var(--warn); } .ohead .clock.bad .v { color: var(--bad); } .ohead .clock.done .v { color: var(--good); }
.stageline { display: flex; flex-wrap: wrap; gap: 4px 0; margin-top: 10px; font-size: 11.5px; color: var(--muted); align-items: center; }
.stageline .s { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; }
.stageline .s.on { background: var(--good-soft); color: var(--good); font-weight: 600; }
.stageline .s.now { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.stageline .arrow { color: var(--line); padding: 0 1px; }
.stageline .note { width: 100%; margin-top: 4px; }
.match { border: 2px solid var(--good); }
.match.waiting { border-color: var(--donor); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--good); }
.match.waiting .tag { color: var(--donor); }
.match h3 { font-size: 20px; font-weight: 700; margin-top: 6px; letter-spacing: -0.01em; }
.addr { color: var(--muted); font-size: 13px; margin-top: 2px; }
.addr b { color: var(--fg); font-weight: 600; }
.addr a { color: var(--donor); font-weight: 600; text-decoration: none; }
.addr a:hover { text-decoration: underline; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); }
.chk.good { background: var(--good-soft); color: var(--good); } .chk.warn { background: var(--warn-soft); color: var(--warn); } .chk.bad { background: var(--bad-soft); color: var(--bad); }
.feeds { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.feeds b { color: var(--fg); font-weight: 600; }
details.msg { margin-top: 10px; }
details.msg summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--donor); list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
details.msg summary::-webkit-details-marker { display: none; }
details.msg pre { margin: 8px 0 0; white-space: pre-wrap; font: inherit; font-size: 13px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.copy { font-size: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 3px 9px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.actions.one { grid-template-columns: 1fr; }
.actions.three { grid-template-columns: 1fr 1fr 1fr; }
.list .it { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.list .it:first-of-type { border-top: 0; }
.list .n { width: 26px; height: 26px; border-radius: 50%; background: var(--warn-soft); color: var(--warn); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.list .t { font-weight: 600; font-size: 13px; }
.list .d { font-size: 12px; color: var(--muted); }
.list .w { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.split .it { grid-template-columns: minmax(0, 1fr) auto; }
details.skips summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
details.skips summary::-webkit-details-marker { display: none; }
details.skips summary .why { font-weight: 500; font-size: 12px; color: var(--muted); text-align: right; }
details.skips .sk { font-size: 12.5px; padding: 8px 0; border-top: 1px solid var(--line); }
details.skips .sk:first-of-type { margin-top: 8px; }
details.skips .sk b { font-weight: 600; }
.error { border-color: var(--bad); }
.error b { color: var(--bad); }
.audit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.audit div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.audit .k { font-size: 11px; color: var(--muted); }
.audit .v { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.audit .v small { font-size: 11px; color: var(--muted); font-weight: 500; font-family: var(--font-body); }
.pol { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.pol .seg { padding: 2px; }
.pol .seg button { padding: 6px 9px; font-size: 12px; }
.chk.high { background: var(--donor-soft); color: var(--donor); }
.ask { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.ask button { font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
.ask button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.answer { margin-top: 8px; font-size: 13px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-height: 40px; white-space: pre-wrap; }
.answer .src { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; white-space: normal; }
/* Register a pantry: a scripted intake conversation (demo) */
.chat { display: grid; gap: 8px; }
.chat .m { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
.chat .m.agent { background: var(--surface-2); border-bottom-left-radius: 4px; justify-self: start; }
.chat .m.me { background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; justify-self: end; }
.chat .opts { display: flex; gap: 6px; flex-wrap: wrap; justify-self: end; }
.chat .opts button { font-size: 12.5px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--accent); background: var(--surface); color: var(--fg); }
.chat .opts button:hover { background: var(--accent); color: var(--on-accent); }
.profile { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12.5px; margin-top: 8px; }
.profile .k { color: var(--muted); }
.profile .v { font-weight: 600; }
.profile .full { grid-column: 1 / -1; }
.profile pre { margin: 4px 0 0; white-space: pre-wrap; font: inherit; font-size: 12.5px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; }

.mapwrap { position: relative; min-height: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--map-bg); min-width: 0; }
#map { position: absolute; inset: 0; z-index: 1; background: var(--map-bg); }
.leaflet-container { font-family: var(--font-body); }
.leaflet-tile-pane { filter: var(--tile-filter); }
.leaflet-popup-content-wrapper { background: var(--surface); color: var(--fg); border-radius: 10px; box-shadow: var(--shadow); font-size: 12.5px; }
.leaflet-popup-content { margin: 10px 12px; line-height: 1.4; }
.leaflet-popup-content b { display: block; font-weight: 600; }
.leaflet-popup-tip { background: var(--surface); }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent); color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-bar a { background: var(--surface); color: var(--fg); border-bottom-color: var(--line); }
.pin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #ffffff; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35); font-family: var(--font-body); }
.pin-good { background: var(--good); width: 32px; height: 32px; font-size: 13px; }
.pin-warn { background: var(--warn); }
.pin-bad { background: var(--bad); }
.pin-donor { background: var(--donor); font-size: 14px; }
.pin-van { width: 30px; height: 30px; background: var(--surface); border: 2px solid var(--accent); font-size: 15px; }
/* Standalone preview (no matcher, no map tiles): the same pins drawn as a plain schematic. */
#map svg.smap { width: 100%; height: 100%; display: block; background: var(--map-bg); font-family: var(--font-body); }
.smap .grid { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
.smap .route { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; opacity: 0.85; }
.smap .pin-c { stroke: var(--surface); stroke-width: 4; }
.smap .pin-c.good { fill: var(--good); } .smap .pin-c.warn { fill: var(--warn); } .smap .pin-c.bad { fill: var(--bad); } .smap .pin-c.donor { fill: var(--donor); }
.smap .pin-c.van { fill: var(--surface); stroke: var(--accent); stroke-width: 3; }
.smap .pin-t { fill: #ffffff; font-weight: 700; font-size: 15px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.smap .pin-t.emoji { font-size: 18px; }
.smap .ring { fill: var(--good); opacity: 0.18; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
.smap .name { fill: var(--fg); font-size: 14px; font-weight: 600; paint-order: stroke; stroke: var(--map-bg); stroke-width: 4px; stroke-linejoin: round; }
.pin-wrap { position: relative; display: grid; place-items: center; }
.pin-wrap .ring { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: var(--good); opacity: 0.18; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(0.5); opacity: 0.35; } 100% { transform: scale(1.1); opacity: 0; } }

.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.spin { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--fg); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 1000px) {
  html, body { height: auto; }
  .app { height: auto; }
  .screen-offer { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(300px, 44vh) auto; height: auto; }
  .mapwrap { order: -1; min-height: 300px; }
  .stack, .board, .screen-new { overflow: visible; }
}
@media (max-width: 640px) {
  .calls, .row2, .actions, .actions.three { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; }
  .row .right { justify-items: start; grid-auto-flow: column; align-items: center; gap: 10px; }
  .ohead { grid-template-columns: 1fr; }
  .ohead .clock { text-align: left; }
  .unit { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } .pin-wrap .ring, .smap .ring { animation: none; opacity: 0.18; transform: none; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand" id="brand" role="button" tabindex="0" title="Today's board">
      <div class="mark">R</div>
      <h1>RescueDispatch</h1>
    </div>
    <a class="btn primary" href="#new" id="newBtn">📞 A donor called</a>
  </header>

  <!-- Screen 1: today's board -->

  const no = (req.declined_recipient_names || []).map(n => n.trim().toLowerCase());
  const base = (no.length && DEMO[key + ":declined1"]) || DEMO[key];
  if (!base) return null;
  const d = JSON.parse(JSON.stringify(base));
  d.matches = (d.matches || []).filter(m => !no.includes(m.name.trim().toLowerCase()));
  if (req.routing_policy === "logistics_first") d.matches.sort((a, b) => (b.max_pallets - a.max_pallets) || (a.pickup_window_hours - b.pickup_window_hours) || (a.distance_km - b.distance_km));
  d.matches.forEach((m, i) => { m.rank = i + 1; });
  d.posting_summary = { ...d.posting_summary, posting_text: req.posting_text, pallets_offered: req.pallets_offered, donor_deadline_hours: req.donor_deadline_hours };
  if (d.clock) { d.clock.donor_deadline_hours = req.donor_deadline_hours; d.clock.effective_window_hours = Math.min(req.donor_deadline_hours, d.clock.usda_shelf_life_hours || req.donor_deadline_hours); }
  return d;
}

/* ==================================================================
   api — the seam between this page and the backend.
   Real route first; a mock with data otherwise. A lane that builds the real thing swaps
   one function here and nothing else on the page changes.

   api.match(req)                POST /api/match         exists   → MatchResponse (Contract 1; + routing_policy)
   api.equity()                  GET  /api/equity_audit  exists   → { metro_baseline, matched_cohort, honest_take }
   api.brief(req, question)      POST /api/brief         exists   → { answer, source }
   api.offers.list()             GET  /api/offers        mock     → Offer[]
   api.offers.create(offer)      POST /api/offers        mock     → Offer (with id)
   api.offers.update(id, patch)  PATCH /api/offers/{id}  mock     → Offer
   api.offers.reset(list)        demo only
   api.intake.register(p)        POST /api/intake        mock     → { recipient_id, ...p }
       p = { name_and_place, cold_storage, max_pallets, refrigerated_transport, pickup_window_hours, profile_text }
   api.traffic(q)                GET  /api/traffic       mock     → { minutes, traffic: "light"|"moderate"|"heavy", source }
       q = { from: {lat, lon}, to: {lat, lon}, distance_km, departAt }   (real one: a traffic-aware routing API)

   Offer = {
     id, createdAt, deadlineAt (ISO), donor (who called),
     req: MatchRequest, result: MatchResponse | null,
     stage: "new" | "matched" | "sent" | "accepted" | "picked_up" | "delivered" | "nobody",
     stamps: { [stage]: ISO },   declined: [{ name, at }],   split: boolean,   example: boolean
   }
   Mock storage: localStorage "rescue.offers.v1" (this browser only).
================================================================== */
const STORE_KEY = "rescue.offers.v1";
let mem = null;   // in-memory copy so the page still works when storage is blocked
const store = {
  read() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch { return []; } },
  write(list) { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch { /* keep in memory only */ } },
};
const api = {
  async match(req) {
    let raw = null;
    try {
      const res = await fetch("/api/match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      raw = await res.json();
      if (!raw || !Array.isArray(raw.matches)) throw new Error("not a match result");
    } catch {
      raw = demoResponse(req);
      if (!raw) throw new Error("Couldn't reach the matcher");
    }
    return normalize(raw, req);
  },
  async equity() {
    try { const res = await fetch("/api/equity_audit"); if (!res.ok) throw new Error(); const j = await res.json(); if (!j || !j.metro_baseline) throw new Error(); return j; }
    catch { return DEMO_EQUITY; }
  },
  async brief(req, question) {
    try {
      const res = await fetch("/api/brief", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...req, question }) });
      if (!res.ok) throw new Error(); const j = await res.json(); if (!j || !j.answer) throw new Error(); return j;
    } catch { return null; }
  },
  async traffic(q) {
    // Mock: Chicago surface-street pace by time of day. Swap for a traffic-aware routing call.
    const d = new Date(q.departAt || Date.now()), t = d.getHours() + d.getMinutes() / 60;
    const level = (t >= 7 && t < 10) || (t >= 15.5 && t < 19) ? "heavy" : (t >= 10 && t < 15.5) || (t >= 19 && t < 21) ? "moderate" : "light";
    const perKm = { light: 2.2, moderate: 3.0, heavy: 4.2 }[level];
    return { minutes: Math.max(4, Math.round((q.distance_km || 3) * perKm + 3)), traffic: level, source: "estimate" };
  },
  intake: {
    async register(p) {
      const rec = { recipient_id: "new-" + Date.now().toString(36), ...p };
      try { const list = JSON.parse(localStorage.getItem("rescue.intake.v1") || "[]"); list.push(rec); localStorage.setItem("rescue.intake.v1", JSON.stringify(list)); } catch { /* keep in memory only */ }
      return rec;
    },
  },
  offers: {
    async list() { if (!mem) mem = store.read(); return mem; },
    async create(o) { const list = await this.list(); o.id = o.id || "o-" + Date.now().toString(36); list.push(o); store.write(list); return o; },
    async update(id, patch) { const list = await this.list(); const o = list.find(x => x.id === id); if (!o) throw new Error("no offer " + id); Object.assign(o, patch); store.write(list); return o; },
    async reset(list) { mem = list; store.write(list); },
  },
};

/* Example offers already in flight, so the board shows a real afternoon on first open. */
function exampleOffers() {
  const now = Date.now(), m = 60000;
  const make = (key, stage, minsLeft, ageMin, stamped) => {

function timeValue(d) { return `${String(d.getHours()).padStart(2, "0")}:${String(Math.floor(d.getMinutes() / 5) * 5).padStart(2, "0")}`; }
function hoursUntil(t) {
  const [hh, mm] = (t || "").split(":").map(Number);
  if (Number.isNaN(hh)) return 6;
  const d = new Date(); d.setHours(hh, mm || 0, 0, 0);
  if (d.getTime() <= Date.now() + 60000) d.setDate(d.getDate() + 1);
  return Math.max(0.5, Math.round((d.getTime() - Date.now()) / 3.6e5) / 10);
}

async function runMatch(offer) {
  const req = { ...offer.req, donor_deadline_hours: Math.max(0.5, Math.round(left(offer.deadlineAt) / 3.6e5) / 10), declined_recipient_names: offer.declined.map(d => d.name) };

        ${r.split_plan.map(x => `<div class="it"><div><div class="t">${esc(nice(x.name))}</div><div class="d">${x.allocated_pallets} pallet${x.allocated_pallets > 1 ? "s" : ""} · ${x.distance_km} km</div>${o.split ? `<details class="msg" style="margin-top:4px"><summary><span>📱 Their message</span></summary><pre>${esc(x.draft_split_message)}</pre></details>` : ""}</div><div class="w">${x.allocated_pallets} of ${x.max_pallets}</div></div>`).join("")}
        ${o.split ? "" : `<div class="actions one"><button class="btn go" type="button" data-act="split">📲 Send to all ${n} (${total} pallets)</button></div>`}
      </section>`;
    }
    if (backups.length && o.stage !== "delivered") {
      html += `<section class="card list"><h2>They said no? Try next pantry</h2>
        ${backups.map((b, i) => `<div class="it"><div class="n num">#${b.rank}</div><div><div class="t">${esc(nice(b.name))}</div><div class="d">${esc(nice(b.street))} · ${b.distance_km} km · ~${btr[i].minutes} min drive · ${esc(coolerWord(b.cold_storage))}${b.refrigerated_transport ? " · own van" : " · needs a driver"}</div></div><div class="w num">collects in ${hrs(b.pickup_window_hours)}<br>${hrs(b.margin_hours)} to spare</div></div>`).join("")}
      </section>`;
    }
  }
  if (skipped.length) {
    const counts = {}; skipped.forEach(x => { const w = REASON_WORD[x.reason_code] || "other"; counts[w] = (counts[w] || 0) + 1; });
    html += `<section class="card"><details class="skips"><summary><span>Why we skipped ${skipped.length}</span><span class="why">${Object.entries(counts).map(([w, n]) => `${n} ${w}`).join(" · ")}</span></summary>
      ${skipped.map(x => `<div class="sk"><b>${esc(nice(x.name))}</b> <span class="hint">· #${x.semantic_rank} on meaning</span><div>${esc(humanReason(x, o.req.posting_text))}</div></div>`).join("")}
    </details></section>`;
  }
  $("stack").innerHTML = html;
  $("stack").scrollTop = 0;
  $("stack").querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => act(b.dataset.act)));
  const pol = $("policy"); if (pol) pol.addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.p !== (o.req.routing_policy || "equity_weighted")) act("policy:" + b.dataset.p); });
  const ask = $("ask"); if (ask) ask.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; [...ask.children].forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); askBroker(o, +b.dataset.q); });
  $("stack").querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async e => {
    e.preventDefault(); e.stopPropagation();
    const text = $(b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(text); toast("Message copied."); }
    catch { const rng = document.createRange(); rng.selectNodeContents($(b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(rng); toast("Select and copy the message."); }
  }));
  if (r) drawMap(r); else clearMap();
}
async function act(a) {
  const o = current; if (!o) return;
  const now = new Date().toISOString();
  const top = o.result && o.result.matches[0];
  if (a === "no") {
    const declined = [...o.declined, { name: top.name, at: now }];
    await api.offers.update(o.id, { declined, stage: "new", stamps: {}, split: false });
    render(); runMatch({ ...o, declined }); return;
  }
  if (a === "driver-mode") { const req = { ...o.req, requires_pickup_van: false }; await api.offers.update(o.id, { req, stage: "new" }); render(); runMatch({ ...o, req }); return; }
  if (a.startsWith("policy:")) { const req = { ...o.req, routing_policy: a.slice(7) }; await api.offers.update(o.id, { req, stage: "new" }); render(); runMatch({ ...o, req }); return; }
  if (a === "more-time") { const deadlineAt = new Date(new Date(o.deadlineAt).getTime() + 2 * 3.6e6).toISOString(); await api.offers.update(o.id, { deadlineAt, stage: "new" }); render(); runMatch({ ...o, deadlineAt }); return; }
  if (a === "drivers") { const d = $("stack").querySelector("#driverDraft"); if (d) d.closest("details").open = true; toast("Driver message is ready to copy."); return; }
  if (a === "split") { await api.offers.update(o.id, { stage: "sent", split: true, stamps: { ...o.stamps, sent: now } }); render(); return; }
  if (["sent", "accepted", "picked_up", "delivered"].includes(a)) { await api.offers.update(o.id, { stage: a, stamps: { ...o.stamps, [a]: now } }); render(); return; }
}
async function renderFoot() {
  const list = await api.offers.list();

  const ex = list.some(o => o.example);

  const c = $("clearEx"); if (c) c.addEventListener("click", async () => { await api.offers.reset(list.filter(o => !o.example)); render(); });

/* Ask the broker: the seven coordinator questions. /api/brief answers when it can; otherwise the match result does. */
async function askBroker(o, i) {
  const box = $("answer"); if (!box) return;
  box.innerHTML = `<span class="hint"><span class="spin"></span>Asking…</span>`;
  const j = await api.brief(o.req, QUESTIONS[i]);
  if (j) { box.innerHTML = esc(j.answer) + `<span class="src">Source: ${j.source === "gemini_adk" ? "Gemini via ADK" : "the broker's own checks"}</span>`; return; }
  box.innerHTML = esc(templateAnswer(o, i)) + '<span class="src">Source: the match result</span>';
}
function templateAnswer(o, i) {
  const d = o.result, t = d.matches[0], b = d.matches[1], c = d.clock, g = d.rejected_decoys[0];
  if (!t) return "No pantry passes every check right now. See why we skipped them below.";
  switch (i) {
    case 0: return `${nice(t.name)}, ${nice(t.street)}. ${coolerWord(t.cold_storage)}, ${t.refrigerated_transport ? "their own van" : "needs a driver"}, collects within ${hrs(t.pickup_window_hours)} with ${hrs(t.margin_hours)} to spare.`;
    case 1: return g ? `${nice(g.name)} ranked #${g.semantic_rank} on meaning, but ${humanReason(g, o.req.posting_text).replace(/^Why we skipped \w+: /, "")} ${nice(t.name)} passes every check and serves a neighbourhood where ${t.equity_context.poverty_rate}% live in poverty.` : `${nice(t.name)} passed every check.`;
    case 2: return b ? `${nice(b.name)}, ${nice(b.street)}. ${coolerWord(b.cold_storage)}, ${b.refrigerated_transport ? "own van" : "needs a driver"}, collects within ${hrs(b.pickup_window_hours)}. Press "They said no" to move to them.` : "No backup left. Give it more time or send a driver.";
    case 3: return c && c.usda_shelf_life_hours ? `USDA FoodKeeper lists ${c.matched_usda_product} at about ${c.usda_shelf_life_hours} h in a home fridge. That's consumer guidance, not cold-chain science, so the donor's deadline (${hrs(c.donor_deadline_hours)}) is the clock.` : `USDA has no clean number for this one, so the donor's deadline is the clock.`;
    case 4: return t.refrigerated_transport && o.req.requires_pickup_van ? `${nice(t.name)} collects in their own refrigerated van. No driver needed.` : `${nice(t.name)} needs a driver. The driver message is ready above.`;
    case 5: return `${nice(t.name)} sits in a census tract where ${t.equity_context.poverty_rate}% of people live in poverty and ${t.equity_context.pct_no_vehicle}% of households have no car.${b ? ` That is what broke the tie with ${nice(b.name)}.` : ""}`;
    case 6: return t.draft_message;
  }
}

/* Register a pantry: scripted intake (demo). The real agent is Lane 2's agent/intake.py. */
let intake = null;
function renderIntake() {

}
function say(who, text) { $("chat").insertAdjacentHTML("beforeend", `<div class="m ${who}">${esc(text)}</div>`); $("chat").lastElementChild.scrollIntoView({ block: "nearest" }); }

  const opts = $("chat").lastElementChild;
  opts.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; intake.answers[q.key] = JSON.parse(b.dataset.v); opts.remove(); say("me", b.textContent); askNext(); });
}
async function finishIntake() {

  const rec = await api.intake.register({ name_and_place: intake.text.trim(), ...a, profile_text });
  say("agent", "Here's the profile I'll save. The next search can find you.");
  $("chat").insertAdjacentHTML("beforeend", `<section class="card" style="justify-self:stretch"><div class="profile">
    <span class="k">Cold storage</span><span class="v">${esc(coolerWord(a.cold_storage) === "none" ? "None" : coolerWord(a.cold_storage))}</span>
    <span class="k">Pallets</span><span class="v">${a.max_pallets === 0 ? "Hand-carry only" : "Up to " + a.max_pallets}</span>

    <span class="k">Collects within</span><span class="v">${hrs(a.pickup_window_hours)}</span>
    <div class="full"><span class="k">Profile text (what the search reads)</span><pre>${esc(profile_text)}</pre></div>
  </div><div class="actions" style="margin-top:10px"><a class="btn go" href="#board">✅ Saved · back to the board</a><button class="btn" type="button" id="intakeAgain">Register another</button></div>
  <p class="hint" style="margin-top:8px">Saved in this browser for the demo (${esc(rec.recipient_id)}). Lane 2's intake agent writes this to BigQuery and embeds it.</p></section>`);

$("intakeForm").addEventListener("submit", e => {
  e.preventDefault();

function tickClocks() {
  document.querySelectorAll("[data-clock]").forEach(el => {
    if (el.dataset.stage === "delivered") return;
    const ms = left(el.dataset.clock);
    el.textContent = el.dataset.fmt === "long" ? leftLong(ms) : leftShort(ms);
    const box = el.classList.contains("v") ? el.parentElement : el;
    box.classList.remove("warn", "bad"); const c = leftCls(ms, el.dataset.stage); if (c) box.classList.add(c);

setInterval(tickClocks, 1000);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------------------------------------------------------------
   MAP — Leaflet + OpenStreetMap in the app; a schematic SVG when standalone. Pins from contract lat/lon.
---------------------------------------------------------------- */
let map = null, pinsLayer = null, vanMarker = null, vanRaf = null, routePts = null, vanT = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function initMap() {
  if (map) return;
  $("map").innerHTML = "";
  map = L.map("map", { zoomControl: true }).setView([DONOR.lat, DONOR.lon], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19 }).addTo(map);
  pinsLayer = L.layerGroup().addTo(map);
}
function clearMap() { if (map) { pinsLayer.clearLayers(); cancelAnimationFrame(vanRaf); } else $("map").innerHTML = ""; }
const pinIcon = (cls, label, ring) => L.divIcon({ className: "", html: `<div class="pin-wrap">${ring ? '<div class="ring"></div>' : ""}<div class="pin ${cls}">${label}</div></div>`, iconSize: [60, 60], iconAnchor: [30, 30], popupAnchor: [0, -22] });
function svgMap(d) {
  const donor = d.posting_summary.donor, top = d.matches[0], offer = d.posting_summary.posting_text;
  const pts = [donor, ...d.matches, ...d.rejected_decoys.filter(x => x.lat != null && x.lon != null)];
  const k = Math.cos(donor.lat * Math.PI / 180);
  const xs = pts.map(p => p.lon * k), ys = pts.map(p => p.lat);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 0.03) * 1.45;
  const box = $("map"), r = Math.max(0.7, Math.min(2.4, (box.clientWidth || 700) / (box.clientHeight || 500)));
  const W = 1000 * r, H = 1000;
  const X = p => W / 2 + 1000 * (p.lon * k - cx) / span, Y = p => H / 2 - 1000 * (p.lat - cy) / span;
  const grid = []; for (let g = 100; g < W; g += 100) grid.push(`<line class="grid" x1="${g}" y1="0" x2="${g}" y2="${H}"/>`); for (let g = 100; g < H; g += 100) grid.push(`<line class="grid" x1="0" y1="${g}" x2="${W}" y2="${g}"/>`);
  const pin = (p, cls, label, radius = 16, emoji = false) => `<g><title>${esc(p.title)}</title><circle class="pin-c ${cls}" cx="${X(p)}" cy="${Y(p)}" r="${radius}"/><text class="pin-t${emoji ? " emoji" : ""}" x="${X(p)}" y="${Y(p)}">${label}</text></g>`;
  let s = grid.join("");
  d.rejected_decoys.filter(x => x.lat != null && x.lon != null).forEach(x => { s += pin({ ...x, title: `Skipped: ${x.name}. ${humanReason(x, offer)}` }, "bad", "✕"); });
  d.matches.slice(1).forEach(m => { s += pin({ ...m, title: `#${m.rank} backup: ${m.name}, ${m.distance_km} km` }, "warn", "#" + m.rank) + `<text class="name" x="${X(m) + 22}" y="${Y(m) + 5}">${esc(nice(m.name))}</text>`; });
  if (top) {
    const turn = { lat: top.lat, lon: donor.lon };
    s += `<polyline class="route" points="${X(donor)},${Y(donor)} ${X(turn)},${Y(turn)} ${X(top)},${Y(top)}"/>`;
    s += `<circle class="ring" cx="${X(top)}" cy="${Y(top)}" r="40"/>` + pin({ ...top, title: `#1 ${top.name}, ${top.distance_km} km` }, "good", "1", 20) + `<text class="name" x="${X(top) + 26}" y="${Y(top) + 5}">${esc(nice(top.name))}</text>`;
    s += pin({ lat: donor.lat + (turn.lat - donor.lat) * 0.9, lon: donor.lon, title: "Van on the way" }, "van", "🚐", 18, true);
  }
  s += pin({ ...donor, title: `Pickup: ${offer}` }, "donor", "🏪", 18, true);
  box.innerHTML = `<svg class="smap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of the pickup, the pantry that can take it, backups and skipped pantries">${s}</svg>`;
}
function drawMap(d) {
  if (standalone || !window.L) { if (map) { map.remove(); map = null; } svgMap(d); return; }
  initMap();
  setTimeout(() => map && map.invalidateSize(), 60);
  pinsLayer.clearLayers();
  cancelAnimationFrame(vanRaf); vanMarker = null; routePts = null;
  const donor = d.posting_summary.donor, top = d.matches[0], offer = d.posting_summary.posting_text;
  const bounds = [[donor.lat, donor.lon]];
  d.rejected_decoys.forEach(x => {
    if (x.lat == null || x.lon == null) return;
    L.marker([x.lat, x.lon], { icon: pinIcon("pin-bad", "✕") }).bindPopup(`<b>Skipped: ${esc(nice(x.name))}</b>${esc(humanReason(x, offer))}`).addTo(pinsLayer);
    bounds.push([x.lat, x.lon]);
  });
  d.matches.slice(1).forEach(m => {
    L.marker([m.lat, m.lon], { icon: pinIcon("pin-warn", "#" + m.rank) }).bindPopup(`<b>#${m.rank} backup: ${esc(nice(m.name))}</b>${esc(nice(m.street))} · ${m.distance_km} km · collects in ${hrs(m.pickup_window_hours)}`).addTo(pinsLayer);
    bounds.push([m.lat, m.lon]);
  });
  if (top) {
    routePts = [[donor.lat, donor.lon], [top.lat, donor.lon], [top.lat, top.lon]];   // Chicago grid: one turn
    L.polyline(routePts, { color: css("--accent"), weight: 5, opacity: 0.85, lineJoin: "round", lineCap: "round" }).addTo(pinsLayer);
    L.marker([top.lat, top.lon], { icon: pinIcon("pin-good", "1", true), zIndexOffset: 500 }).bindPopup(`<b>#1 ${esc(nice(top.name))}</b>${esc(nice(top.street))} · ${top.distance_km} km · ${esc(coolerWord(top.cold_storage))}${top.refrigerated_transport ? ", own van" : ", needs a driver"}`).addTo(pinsLayer);
    bounds.push([top.lat, top.lon]);
    vanMarker = L.marker(routePts[0], { icon: pinIcon("pin-van", "🚐"), zIndexOffset: 1000, interactive: false }).addTo(pinsLayer);
    vanT = 0; if (!reduce) animateVan(); else vanMarker.setLatLng(lerpRoute(0.45));
  }
  L.marker([donor.lat, donor.lon], { icon: pinIcon("pin-donor", "🏪"), zIndexOffset: 800 }).bindPopup(`<b>Pickup</b>${esc(offer)}`).addTo(pinsLayer);
  map.fitBounds(bounds, { padding: [60, 60], maxZoom: 14 });
}
function lerpRoute(t) {
  const [a, k, b] = routePts;
  const s1 = Math.hypot(k[0] - a[0], k[1] - a[1]), s2 = Math.hypot(b[0] - k[0], b[1] - k[1]), L2 = s1 + s2 || 1;
  const dist = Math.min(1, t) * L2;
  if (dist <= s1) { const f = s1 ? dist / s1 : 0; return [a[0] + (k[0] - a[0]) * f, a[1] + (k[1] - a[1]) * f]; }
  const f = s2 ? (dist - s1) / s2 : 0; return [k[0] + (b[0] - k[0]) * f, k[1] + (b[1] - k[1]) * f];
}
function animateVan() {
  if (!vanMarker || !routePts) return;
  vanT = (vanT + 0.003) % 1.2;
  vanMarker.setLatLng(lerpRoute(vanT));
  vanRaf = requestAnimationFrame(animateVan);
}
